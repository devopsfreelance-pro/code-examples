# Parametros de kernel para hardening (inspirado en CIS Benchmarks 3.x)
# Aplicar con: sysctl -p /etc/sysctl.d/99-hardening.conf

# Deshabilitar redirecciones ICMP (evita ataques de tipo man-in-the-middle via ICMP redirect)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignorar ICMP echo a direcciones broadcast (proteccion contra ataques smurf)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Habilitar SYN cookies contra ataques de SYN flood
net.ipv4.tcp_syncookies = 1

# Deshabilitar IP forwarding salvo que el host sea un router
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Deshabilitar source routing (evita spoofing de rutas)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Registrar paquetes con direccion de origen invalida (martian packets)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ASLR completo (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# Restringir acceso al buffer de dmesg a usuarios sin privilegios
kernel.dmesg_restrict = 1

# Restringir ptrace a procesos hijos directos (dificulta la inyeccion de codigo)
kernel.yama.ptrace_scope = 1

# No generar core dumps de binarios con setuid (evita fuga de credenciales en memoria)
fs.suid_dumpable = 0
