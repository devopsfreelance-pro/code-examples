services:
  db:
    image: postgres:16-alpine
    container_name: pitr-demo-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=cp %p /wal_archive/%f
      - -c
      - max_wal_senders=5
      - -c
      - shared_buffers=32MB
    ports:
      - "5432:5432"
    volumes:
      - ./wal_archive:/wal_archive
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db_data:
