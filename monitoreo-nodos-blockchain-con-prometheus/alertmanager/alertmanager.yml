global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'devops-team'

  routes:
    - match:
        severity: critical
      receiver: 'devops-critical'
      repeat_interval: 30m

receivers:
  # Receiver sin integraciones externas: las alertas quedan visibles en la UI
  # de Alertmanager (http://localhost:9093) sin necesidad de un webhook real.
  # En produccion aqui iria slack_configs / pagerduty_configs con las
  # credenciales en un secret manager, nunca en el repo.
  - name: 'devops-team'
  - name: 'devops-critical'
