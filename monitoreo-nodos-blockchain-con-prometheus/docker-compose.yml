services:
  mock-exporter:
    image: python:3.12-slim
    container_name: mock-exporter
    working_dir: /app
    volumes:
      - ./mock-exporter:/app:ro
    command: ["python3", "mock_exporter.py"]
    environment:
      PORT: "8000"
      # Descomentar para forzar un escenario de alerta:
      # SIMULATE_OUT_OF_SYNC: "1"
      # SIMULATE_LOW_PEERS: "1"
      # SIMULATE_MEMPOOL_FULL: "1"
    ports:
      - "8000:8000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - mock-exporter
      - node-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
