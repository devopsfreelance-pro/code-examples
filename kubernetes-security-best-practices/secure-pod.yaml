# Pod endurecido siguiendo el nivel "restricted" de Pod Security
# Standards: non-root, filesystem de solo lectura, sin capabilities
# adicionales y con seccomp. Este pod SI debe ser admitido por el
# namespace secure-demo.
apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: secure-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    # Imagen preparada para correr como non-root y escuchar en un
    # puerto no privilegiado (8080), a diferencia de nginx:alpine
    # estandar que necesita root para bindear el puerto 80.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: cache
      mountPath: /var/cache/nginx
    - name: run
      mountPath: /var/run
  volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
  - name: run
    emptyDir: {}
