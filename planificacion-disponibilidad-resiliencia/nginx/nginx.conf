worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Redundancia: dos backends detras de un unico balanceador.
    # max_fails/fail_timeout implementan un failover pasivo (equivalente
    # simplificado de un circuit breaker): si un backend falla 2 veces
    # seguidas, Nginx deja de enviarle trafico durante 10s y reintenta luego.
    upstream backend_pool {
        server web1:8000 max_fails=2 fail_timeout=10s;
        server web2:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_500;
            proxy_next_upstream_tries 2;
        }

        location /status {
            stub_status on;
            access_log off;
        }
    }
}
