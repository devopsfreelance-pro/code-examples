services:
  redis:
    image: redis:7-alpine
    container_name: redis-caching-sessions
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --maxmemory
      - "25mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo:
    image: python:3.12-slim
    container_name: redis-caching-sessions-demo
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: >
      sh -c "pip install --no-cache-dir redis==5.0.8 --quiet && sleep infinity"
