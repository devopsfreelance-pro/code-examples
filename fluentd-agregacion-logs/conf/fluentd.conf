# Pipeline de Fluentd: entrada HTTP -> filtros -> routing con copy a dos destinos.
# Reproduce en miniatura el patrón del post: enriquecer eventos, descartar ruido
# (health-checks) y duplicar los eventos "críticos" hacia dos salidas distintas.

<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# Enriquece todos los eventos con contexto, igual que record_transformer
# en el post agrega hostname/environment antes de rutear.
<filter app.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "demo"
  </record>
</filter>

# Descarta ruido de health-check, igual que el filtro grep del post.
<filter app.**>
  @type grep
  <exclude>
    key message
    pattern /health-check/
  </exclude>
</filter>

# Eventos críticos: copy hacia dos destinos simultáneos (archivo + stdout),
# equivalente al copy a Elasticsearch + Slack del post.
<match app.critical.**>
  @type copy
  <store>
    @type file
    path /fluentd/log/critical
    append true
    <buffer>
      @type memory
      flush_mode interval
      flush_interval 1s
    </buffer>
  </store>
  <store>
    @type stdout
  </store>
</match>

# Resto de eventos de la app: destino único, buffer en archivo.
<match app.**>
  @type file
  path /fluentd/log/general
  append true
  <buffer>
    @type file
    path /fluentd/buffer/general
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 1M
  </buffer>
</match>
