services:
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI web
      - "4319:4317"    # OTLP gRPC (evita colision con el puerto del collector)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  coupon-service:
    build: ./coupon-service
    environment:
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
    ports:
      - "5001:5001"
    depends_on:
      - otel-collector

  checkout-service:
    build: ./checkout-service
    environment:
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
      COUPON_SERVICE_URL: http://coupon-service:5001
    ports:
      - "5000:5000"
    depends_on:
      - otel-collector
      - coupon-service
