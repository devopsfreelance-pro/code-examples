apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-node
  labels:
    app: {{ .Release.Name }}-node
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-node
  ports:
    - name: rpc
      port: {{ .Values.service.rpcPort }}
      targetPort: {{ .Values.service.rpcPort }}
