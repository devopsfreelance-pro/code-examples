global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: blockchain_nodes
    static_configs:
      - targets: ["node1:8000"]
        labels:
          node_id: node-1
      - targets: ["node2:8000"]
        labels:
          node_id: node-2
      - targets: ["node3:8000"]
        labels:
          node_id: node-3
