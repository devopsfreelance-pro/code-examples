apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.webapp.example.com
spec:
  group: webapp.example.com
  names:
    kind: WebApp
    listKind: WebAppList
    plural: webapps
    singular: webapp
    shortNames:
      - wa
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      # El subrecurso status separa el estado deseado (spec) del estado
      # actual (status), tal como describe el post: esto habilita que
      # `kubectl edit`/`kubectl apply` solo puedan tocar spec, mientras
      # que el controller es el único que escribe en status.
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - image
                - domain
              properties:
                image:
                  type: string
                  description: Imagen de contenedor a desplegar
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 2
                domain:
                  type: string
                  description: Dominio lógico de la WebApp (solo se guarda como anotación en este ejemplo)
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$'
                port:
                  type: integer
                  default: 8080
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                lastReconcileTime:
                  type: string
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
