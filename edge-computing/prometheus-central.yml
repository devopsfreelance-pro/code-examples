## Prometheus central: NO scrapea sensores directamente, solo federa
## metricas ya agregadas desde el Prometheus del nodo edge. Este es el
## patron de minimizacion de trafico descrito en el post.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "central"

scrape_configs:
  - job_name: "federate-edge"
    honor_labels: true
    metrics_path: "/federate"
    params:
      "match[]":
        - '{job="edge-sensors"}'
    static_configs:
      - targets: ["prometheus-edge:9090"]
