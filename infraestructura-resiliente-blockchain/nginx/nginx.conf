events {
    worker_connections 1024;
}

http {
    upstream blockchain_nodes {
        # least_conn distribuye a los nodos con menos conexiones activas,
        # asi si uno esta lento o caido el trafico se corre a los sanos.
        least_conn;
        server node-a:5000 max_fails=2 fail_timeout=5s;
        server node-b:5000 max_fails=2 fail_timeout=5s;
        server node-c:5000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://blockchain_nodes;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
