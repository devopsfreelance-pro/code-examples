version: "3.8"

services:
  app:
    build: ./app
    container_name: apm-demo-app
    ports:
      - "3000:3000"
    environment:
      OTEL_SERVICE_NAME: apm-demo-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: apm-demo-jaeger
    ports:
      - "16686:16686" # UI de Jaeger
      - "4318:4318" # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: apm-demo-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
