global:
  resolve_timeout: 1m

route:
  receiver: "default-webhook"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - match:
        severity: critical
      receiver: "pagerduty-critical"
      continue: false
    - match:
        severity: warning
      receiver: "slack-warnings"
      continue: false

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://webhook-receiver:8080/default"
        send_resolved: true

  # En produccion este receiver usaria pagerduty_configs con una
  # service_key real. Aqui se simula con un webhook local para poder
  # ver el payload sin depender de una cuenta paga.
  - name: "pagerduty-critical"
    webhook_configs:
      - url: "http://webhook-receiver:8080/critical"
        send_resolved: true

  # En produccion este receiver usaria slack_configs con un api_url
  # real de un Incoming Webhook de Slack.
  - name: "slack-warnings"
    webhook_configs:
      - url: "http://webhook-receiver:8080/warning"
        send_resolved: true
