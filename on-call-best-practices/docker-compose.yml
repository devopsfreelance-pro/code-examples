services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: on-call-demo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: on-call-demo-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - webhook-receiver

  # Receptor generico que imprime en su log cualquier request HTTP que
  # recibe. Reemplaza a PagerDuty/Slack para poder ver, en texto plano,
  # el payload de cada alerta ruteada por severidad.
  webhook-receiver:
    image: mendhak/http-https-echo:31
    container_name: on-call-demo-webhook-receiver
    environment:
      - HTTP_PORT=8080
    ports:
      - "8080:8080"
