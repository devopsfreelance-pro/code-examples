[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

# Capa de recoleccion: Fluent Bit lee (tail) los archivos de log que las apps
# escriben en el volumen compartido /var/log/app, el mismo patron que usa un
# DaemonSet de Fluent Bit leyendo /var/log/containers/ en un nodo real de
# Kubernetes.
[INPUT]
    Name             tail
    Path             /var/log/app/payments.log
    Tag              app.payments
    Parser           docker_json_app
    Refresh_Interval 5
    Read_from_Head   true

[INPUT]
    Name             tail
    Path             /var/log/app/orders.log
    Tag              app.orders
    Parser           docker_json_app
    Refresh_Interval 5
    Read_from_Head   true

# Capa de procesamiento: los outputs reciben el JSON ya parseado por el
# Parser de cada INPUT (equivalente a un filtro "grok"/"json" en Logstash).
[OUTPUT]
    Name         stdout
    Match        app.*
    Format       json_lines

# Capa de almacenamiento y consulta: se envia a Loki, etiquetando cada log
# con el servicio y el nivel para poder filtrar despues (como los indices de
# Elasticsearch o los streams de Graylog).
[OUTPUT]
    Name         loki
    Match        app.*
    Host         loki
    Port         3100
    Labels       job=demo-logs
    Label_keys   $service,$level
    Line_format  json
    Auto_kubernetes_labels off
