version: "3.8"

services:
  loki:
    image: grafana/loki:2.9.6
    container_name: demo-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - logging-demo

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: demo-fluent-bit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - app-logs:/var/log/app:ro
    depends_on:
      - loki
    networks:
      - logging-demo

  grafana:
    image: grafana/grafana:11.1.0
    container_name: demo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki
    networks:
      - logging-demo

  # Simula una app "payments-api": cada 2s escribe una linea de log JSON
  # estructurada a un archivo compartido (equivalente a stdout redirigido a
  # /var/log/containers/ en un nodo real de Kubernetes).
  app-payments:
    image: bash:5.2
    container_name: demo-app-payments
    command: >
      -c 'i=0; while true; do
      i=$$((i+1));
      if [ $$((i % 5)) -eq 0 ]; then level="ERROR"; msg="Failed to process payment"; else level="INFO"; msg="Payment processed successfully"; fi;
      echo "{\"timestamp\":\"$$(date -Iseconds)\",\"level\":\"$$level\",\"service\":\"payments-api\",\"trace_id\":\"tr-$$RANDOM\",\"message\":\"$$msg\",\"latency_ms\":$$((RANDOM % 400))}" >> /var/log/app/payments.log;
      sleep 2;
      done'
    volumes:
      - app-logs:/var/log/app
    networks:
      - logging-demo

  # Simula una app "orders-api" con su propio archivo de log.
  app-orders:
    image: bash:5.2
    container_name: demo-app-orders
    command: >
      -c 'i=0; while true; do
      i=$$((i+1));
      if [ $$((i % 7)) -eq 0 ]; then level="WARN"; msg="Order queue backlog detected"; else level="INFO"; msg="Order created"; fi;
      echo "{\"timestamp\":\"$$(date -Iseconds)\",\"level\":\"$$level\",\"service\":\"orders-api\",\"trace_id\":\"tr-$$RANDOM\",\"message\":\"$$msg\",\"latency_ms\":$$((RANDOM % 250))}" >> /var/log/app/orders.log;
      sleep 3;
      done'
    volumes:
      - app-logs:/var/log/app
    networks:
      - logging-demo

networks:
  logging-demo:
    driver: bridge

volumes:
  app-logs:
