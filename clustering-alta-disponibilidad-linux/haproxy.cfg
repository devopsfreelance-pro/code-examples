global
    log stdout format raw local0
    maxconn 256

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    stats uri /haproxy?stats
    default_backend http_back

# Backend "activo-activo": ambos nodos reciben trafico en round-robin.
# El health check (httpchk) detecta un nodo caido en pocos segundos y
# HAProxy deja de enrutarle trafico automaticamente (failover),
# igual que describe el post para clusters activo-activo con HAProxy.
backend http_back
    balance roundrobin
    option httpchk GET /
    option redispatch
    retries 2
    default-server inter 1s fall 1 rise 2
    server web1 web1:80 check
    server web2 web2:80 check
