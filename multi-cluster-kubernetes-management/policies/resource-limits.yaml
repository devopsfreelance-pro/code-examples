# Politica global de recursos que se propaga IDENTICA a todos los clusters
# de la flota (ver seccion "Consistencia de Configuracion" del post).
# En un caso real esto vive en Git y lo aplica un agente GitOps (Flux/Argo CD)
# por cluster; aca lo aplicamos a mano con apply-to-all-clusters.sh para que
# el ejemplo corra en minutos sin infraestructura adicional.
apiVersion: v1
kind: Namespace
metadata:
  name: workloads
  labels:
    managed-by: fleet-policy
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-limits
  namespace: workloads
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: workloads
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: 256Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
