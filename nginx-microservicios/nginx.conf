# worker_processes en 1 para que el demo de round-robin sea determinista
# (en producción, usar "auto" para aprovechar todos los cores)
worker_processes 1;
events {
    worker_connections 1024;
}

http {
    # Upstream "usuarios" con dos instancias -> nginx balancea round-robin (default)
    upstream servicio_usuarios {
        server backend-a-1:8000;
        server backend-a-2:8000;
    }

    # Upstream "pedidos" con una sola instancia
    upstream servicio_pedidos {
        server backend-b-1:8000;
    }

    # Zona de memoria compartida para rate limiting: 10 req/s por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    log_format proxy_log '$remote_addr - [$time_local] "$request" '
                          'upstream=$upstream_addr status=$status '
                          'rt=$request_time';

    access_log /dev/stdout proxy_log;

    server {
        listen 80;
        server_name localhost;

        # Enrutamiento por path hacia distintos microservicios (API gateway centralizado)
        location /usuarios/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://servicio_usuarios/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Health check pasivo: si un backend falla, se saca de rotación
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
        }

        location /pedidos/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://servicio_pedidos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx-status {
            stub_status on;
            access_log off;
        }
    }
}
