services:
  backend-a-1:
    build: ./backend
    environment:
      - INSTANCE_NAME=backend-a-1
    networks:
      - backend-net

  backend-a-2:
    build: ./backend
    environment:
      - INSTANCE_NAME=backend-a-2
    networks:
      - backend-net

  backend-b-1:
    build: ./backend
    environment:
      - INSTANCE_NAME=backend-b-1
    networks:
      - backend-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-a-1
      - backend-a-2
      - backend-b-1
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
