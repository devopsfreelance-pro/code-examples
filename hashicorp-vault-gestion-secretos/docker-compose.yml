services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-demo
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./:/demo:ro
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-demo-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
