# 99-tuning-demo.conf
#
# Subconjunto de parametros "namespaced" (aplicables dentro de un contenedor
# Linux sin --privileged) tomados del post "Tuning del Kernel Linux".
# Se usan con `docker compose` via la clave `sysctls:` para comparar un
# contenedor con valores por defecto contra uno con estos valores aplicados.

# Backlog de conexiones pendientes (default: 128)
net.core.somaxconn=65535

# Reducir FIN_WAIT2 (default: 60)
net.ipv4.tcp_fin_timeout=15

# Habilitar SYN cookies (proteccion SYN flood)
net.ipv4.tcp_syncookies=1

# Rango de puertos efimeros ampliado
net.ipv4.ip_local_port_range=1024 65535
