# Upstream activo: apunta a la versión que actualmente recibe tráfico real.
# switch-deployment.sh reescribe esta línea para cambiar de blue a green (o viceversa)
# y recarga nginx sin cortar conexiones existentes.
upstream active {
    server app-blue:5678;
}

server {
    listen 80;

    location / {
        proxy_pass http://active;
        proxy_set_header Host $host;
    }

    location /health {
        return 200 "ok\n";
    }
}
