version: "3.8"

services:
  # "Producción" azul: la versión actualmente sirviendo tráfico
  app-blue:
    image: hashicorp/http-echo:latest
    command: ["-text=Respuesta desde BLUE (v1.0)", "-listen=:5678"]
    networks:
      - pipeline-net

  # "Producción" verde: la nueva versión que el pipeline acaba de desplegar
  app-green:
    image: hashicorp/http-echo:latest
    command: ["-text=Respuesta desde GREEN (v2.0)", "-listen=:5678"]
    networks:
      - pipeline-net

  # Proxy que decide a cuál de los dos entornos enrutar el tráfico real.
  # El pipeline cambia esto en la etapa de "deploy" sin downtime.
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-blue
      - app-green
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
