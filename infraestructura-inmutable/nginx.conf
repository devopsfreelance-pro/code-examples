# Balanceador de trafico (equivalente local al ALB / Target Group del post).
# El bloque upstream apunta a UN solo color a la vez: cambiar de blue a
# green es editar esta linea y recargar nginx, nunca modificar los
# contenedores en si (que son inmutables).
upstream webapp {
    server blue:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://webapp;
        proxy_set_header Host $host;
    }

    location /nginx-health {
        return 200 "ok\n";
    }
}
