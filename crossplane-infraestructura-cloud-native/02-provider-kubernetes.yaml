---
# Provider: provider-kubernetes
# Permite que Crossplane cree/gestione recursos de Kubernetes como si fueran
# infraestructura externa. Lo usamos para simular un provider cloud (AWS/GCP/Azure)
# sin necesitar cuentas ni credenciales reales.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.13.0
---
# ProviderConfig
# Le indica al provider que use las credenciales del propio Service Account
# de Crossplane (InjectedIdentity) para actuar sobre el mismo cluster kind.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: kubernetes-provider
spec:
  credentials:
    source: InjectedIdentity
