---
# Composite Resource Definition (XRD)
# Define la API de infraestructura que van a consumir los desarrolladores:
# un recurso "AppDatabase" con dos parametros simples (engine, size).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappdatabases.example.org
spec:
  group: example.org
  names:
    kind: XAppDatabase
    plural: xappdatabases
  claimNames:
    kind: AppDatabase
    plural: appdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    engine:
                      type: string
                      description: "Motor de base de datos simulado (postgres, mysql, etc.)"
                      default: postgres
                    size:
                      type: string
                      description: "Tamano de la instancia simulada (small, medium, large)"
                      default: small
                  required:
                    - engine
                    - size
              required:
                - parameters
