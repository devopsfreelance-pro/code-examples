apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-web
  labels:
    app: k8s-demo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-demo-web
  template:
    metadata:
      labels:
        app: k8s-demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-content
          configMap:
            name: web-content
