# Pipeline de referencia para Azure DevOps, basado en el post del blog.
# Reproduce en miniatura las mismas etapas (Build -> Test -> Package -> Deploy)
# que el pipeline .NET del artículo, pero para la app Python de este ejemplo.
#
# No hace falta una cuenta de Azure DevOps para probar el CONCEPTO: el script
# scripts/run_pipeline_locally.sh ejecuta localmente los mismos pasos con
# Docker. Este archivo queda como referencia de cómo se vería en Azure Pipelines.

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
  imageName: 'myapp'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build Application'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Install Python'
            inputs:
              versionSpec: '3.12'

          - script: pip install pytest
            displayName: 'Install test dependencies'

          - script: pytest app/test_app.py -v
            displayName: 'Run unit tests'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: 'build'
              Dockerfile: 'Dockerfile'
              tags: |
                $(imageTag)
                latest

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Development Environment'
        environment: 'development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Desplegando $(imageName):$(imageTag) a development"
                    # az webapp deployment container config ... (omitido: requiere suscripción real)
                  displayName: 'Deploy container to App Service'

                - script: |
                    curl -f https://myapp-dev.azurewebsites.net/health || exit 1
                  displayName: 'Smoke test'
