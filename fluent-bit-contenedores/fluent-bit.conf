[SERVICE]
    Flush         2
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               app.logs
    Path              /var/log/app/app.log
    Parser            app_json
    DB                /tmp/flb_app.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Enriquece cada registro con metadata fija, simulando lo que
# el filtro "kubernetes" haria con metadata del pod en un cluster real.
[FILTER]
    Name    modify
    Match   app.logs
    Add     container_name demo-app
    Add     environment    local

# Routing: re-etiqueta los logs con level=error a un tag distinto,
# igual que en el post se enruta infra->S3 y seguridad->CloudWatch
# segun el tag o contenido del registro.
[FILTER]
    Name          rewrite_tag
    Match         app.logs
    Rule          $level ^error$ app.errors false
    Emitter_Name  errors_emitter

# Todos los logs se muestran en stdout (equivalente a "ver logs con kubectl logs").
[OUTPUT]
    Name    stdout
    Match   app.logs
    Format  json_lines

# Solo los logs re-etiquetados como app.errors se archivan aparte.
[OUTPUT]
    Name    file
    Match   app.errors
    Path    /output
    File    errors.log
    Format  plain
