services:
  localstack:
    image: localstack/localstack:3.8
    container_name: tf-modules-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2
      - DEBUG=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
