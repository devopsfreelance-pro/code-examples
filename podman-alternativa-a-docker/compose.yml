# compose.yml pensado para podman-compose (tambien funciona con
# `docker compose`). Define dos servicios y una red EXPLICITA, porque
# a diferencia de Docker, Podman no crea una red bridge automatica:
# hay que declararla si los contenedores necesitan resolverse por nombre.
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - appnet

  redis:
    image: docker.io/library/redis:7-alpine
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
