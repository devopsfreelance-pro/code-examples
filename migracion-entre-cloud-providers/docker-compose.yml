services:
  origin:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: cloudmig-origin
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: origin-admin
      MINIO_ROOT_PASSWORD: origin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - origin-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  destination:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: cloudmig-destination
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dest-admin
      MINIO_ROOT_PASSWORD: dest-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - dest-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  rclone:
    image: rclone/rclone:1.67
    container_name: cloudmig-rclone
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    depends_on:
      origin:
        condition: service_healthy
      destination:
        condition: service_healthy

volumes:
  origin-data:
  dest-data:
