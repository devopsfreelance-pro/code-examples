apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-server
  labels:
    app: ml-model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-model-server
  template:
    metadata:
      labels:
        app: ml-model-server
    spec:
      containers:
        - name: model-server
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=modelo-recomendacion v1.0.0"
            - "-listen=:5678"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: ml-model-server
spec:
  selector:
    app: ml-model-server
  ports:
    - port: 80
      targetPort: 5678
  type: ClusterIP
