global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Capa de almacenamiento: ademas del TSDB local, Prometheus reenvia
# cada muestra a VictoriaMetrics (remote write), tal como describe el
# post para retencion a largo plazo fuera del nodo.
remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      max_shards: 5

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: 'blockchain-nodes'
    static_configs:
      - targets: ['mock-exporter:8000']
        labels:
          environment: 'demo'
