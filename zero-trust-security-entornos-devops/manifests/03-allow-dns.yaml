# Least privilege no significa "sin red": significa acceso minimo explicito.
# Todos los pods necesitan resolver DNS interno (kube-dns/CoreDNS) para
# poder ubicar a otros servicios por nombre.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: zero-trust-demo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
