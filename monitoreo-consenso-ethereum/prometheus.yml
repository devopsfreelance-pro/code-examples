global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "validator_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: 'validator_client'
    static_configs:
      - targets: ['exporter:8081']
        labels:
          instance: validator-client-1
