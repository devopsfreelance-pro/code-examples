global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Punto de entrada: escucha en el puerto 80 y reenvia al backend "web_servers"
frontend http_front
    bind *:80
    default_backend web_servers

# Backend con dos servidores reales, algoritmo roundrobin y health checks HTTP
# activos contra /health (cada 2s). Si un servidor falla 2 chequeos seguidos
# (fall 2) se saca de rotacion; se reincorpora tras 2 chequeos OK (rise 2).
backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server web1 web1:8080 check inter 2s fall 2 rise 2
    server web2 web2:8080 check inter 2s fall 2 rise 2

# Pagina de estadisticas en tiempo real (metricas por frontend/backend/server)
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
