user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS embebido de Docker Compose, necesario para resolver los nombres de
    # servicio de forma dinamica dentro de la variable $edge_backend.
    resolver 127.0.0.11 valid=10s;

    # Enruta la peticion al nodo edge segun el header X-Edge-Region, tal
    # como un CDN enrutaria al Point of Presence mas cercano al usuario.
    map $http_x_edge_region $edge_backend {
        default "edge-us";
        us      "edge-us";
        eu      "edge-eu";
        sa      "edge-sa";
    }

    server {
        listen 80;

        location / {
            set $backend $edge_backend;
            proxy_pass http://$backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Edge-Region $http_x_edge_region;
        }
    }
}
