services:
  edge-us:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./edge-node:/app:ro
    environment:
      - REGION=us
    command: ["python", "app.py"]

  edge-eu:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./edge-node:/app:ro
    environment:
      - REGION=eu
    command: ["python", "app.py"]

  edge-sa:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./edge-node:/app:ro
    environment:
      - REGION=sa
    command: ["python", "app.py"]

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - edge-us
      - edge-eu
      - edge-sa
