---
- name: Configuración declarativa e idempotente de servidores web
  hosts: webservers
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Verificar/instalar Python3 en el contenedor (requerido por Ansible)
      raw: which python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Recolectar facts ahora que Python está disponible
      setup:

  tasks:
    - name: Instalar Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Desplegar página de bienvenida personalizada por host
      template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: "Iniciar Nginx (idempotente: solo si no está corriendo)"
      shell: nginx
      args:
        creates: /run/nginx.pid
