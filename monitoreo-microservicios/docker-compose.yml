services:
  inventory-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./inventory-service:/app
      - ./requirements.txt:/app/requirements.txt
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health/liveness')"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./order-service:/app
      - ./requirements.txt:/app/requirements.txt
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    ports:
      - "5000:5000"
    depends_on:
      inventory-service:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - order-service
      - inventory-service
