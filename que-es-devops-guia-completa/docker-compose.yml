# Fase "Deploy" del ciclo de vida DevOps: levanta el artefacto construido con
# Docker Compose, simulando un entorno de ejecucion (equivalente local a la
# fase "Operate" del post).
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
